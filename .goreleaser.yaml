version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: .
    binary: liora
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.branch={{.Branch}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: packages
    formats:
      - tar.gz
    name_template: >-
      lior-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
  - id: binaries
    formats:
      - binary
    name_template: >-
      liora_{{ .Version }}_{{ .Os }}_{{ .Arch }}

release:
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"
  header: |
    ## Download binaries

    | Platform | Architecture | Archive | Binary |
    |----------|--------------|---------|--------|
    | Linux | amd64 | `lior-cli_{{ .Version }}_linux_amd64.tar.gz` | `liora_{{ .Version }}_linux_amd64` |
    | Linux | arm64 | `lior-cli_{{ .Version }}_linux_arm64.tar.gz` | `liora_{{ .Version }}_linux_arm64` |
    | macOS | amd64 (Intel) | `lior-cli_{{ .Version }}_darwin_amd64.tar.gz` | `liora_{{ .Version }}_darwin_amd64` |
    | macOS | arm64 (Apple Silicon) | `lior-cli_{{ .Version }}_darwin_arm64.tar.gz` | `liora_{{ .Version }}_darwin_arm64` |
    | Windows | amd64 | `lior-cli_{{ .Version }}_windows_amd64.zip` | `liora_{{ .Version }}_windows_amd64.exe` |

    Checksums for all binaries and archives are in `checksums.txt`.

    ## Install

    ### Go

    ```bash
    go install github.com/protorians/lior-cli@{{ .Tag }}
    ```

    ### npm / pnpm / yarn / bun

    ```bash
    npm install -g @liorian/cli
    ```

    ### Homebrew (macOS / Linux)

    ```bash
    brew tap protorians/lior-cli https://github.com/protorians/lior-cli.git
    brew install protorians/lior-cli/liora
    ```

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"