name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.4.0). Creates & pushes the vX.Y.Z tag if missing, then builds and publishes the release in the same run."
        required: true
        type: string

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version & ensure tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      skip: ${{ steps.apply.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r '.version' app.config.json)"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid version '$VERSION' (expected e.g. 0.4.0)"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create & push tag (workflow_dispatch or push to main)
        id: apply
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists on origin — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "release: $TAG"
          git push origin "$TAG"
          echo "::notice::Tag $TAG created & pushed — the release below is built in this same run."
          echo "skip=false" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Export version
        id: version
        run: echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate release notes (download links + changelog)
        id: notes
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md
          echo "Generated release notes (see first / last lines):"
          head -n 12 release-notes.md
          echo "..."
          tail -n 3 release-notes.md

      - name: Run GoReleaser (builds binaries+archives into ./dist, uploads to release)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ./dist artifacts as workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sentients-cli-${{ steps.version.outputs.version }}-dist
          path: dist/
          retention-days: 30

      - name: Update run summary with binaries + changelog
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Release ${TAG}"
            echo ""
            echo "Release page: \`$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${TAG}\`"
            echo ""
            echo "### Binaries built into \`./dist\`"
            echo ""
            echo '```text'
            ls -lh dist/ | sed -E 's/ +/ /g'
            echo '```'
            echo ""
            echo "### Changelog"
            echo ""
            bash scripts/release-notes.sh "$VERSION" | awk '/^## Changelog/{found=1} found'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    name: Publish @sentients/cli to npm
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check NPM_TOKEN presence
        id: npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN not set — skipping npm publish."
          fi

      - name: Update npm package version
        if: steps.npm-token.outputs.available == 'true'
        working-directory: npm/sentient-cli
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Publish to npm
        if: steps.npm-token.outputs.available == 'true'
        working-directory: npm/sentient-cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}